<!-- Required IDs in the video form -->
<input id="videoId" name="id" type="hidden">
<input id="videoTitle" name="title" required placeholder="视频标题">
<input id="videoSlug" name="slug" placeholder="URL Slug">
<textarea id="videoDesc" name="description" placeholder="视频描述"></textarea>
<select id="videoStatus" name="status">
  <option value="draft">草稿</option>
  <option value="published">发布</option>
</select>
<input id="videoSort" name="sort_order" type="number" value="0" placeholder="排序">
<video id="videoPreview" controls preload="metadata" class="hide"></video>
<img id="videoPosterPreview" class="hide" alt="视频封面预览">
<div id="videoSaveResult" class="saveResult"></div>
<div class="inline">
  <button type="submit">保存修改</button>
  <button id="videoNew" type="button">新建</button>
  <button id="videoDelete" type="button" class="danger">删除当前视频</button>
</div>
<div id="videoList"></div>
