<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMUSU CMS V2.2A</title><link rel="stylesheet" href="/admin.css"></head><body><aside><div class="brand">SMUSU CMS</div><a href="#listPanel">产品管理</a><a href="#editor">产品编辑</a><a href="https://staging.ufya.tech" target="_blank">查看网站</a></aside><main><section class="panel" id="listPanel"><h1>产品管理</h1><div id="list"></div><button id="newProduct">+ 新增产品</button></section><section class="panel" id="editor"><h2>新增 / 修改产品</h2><input id="id" type="hidden"><div class="form"><label>产品名称<input id="name"></label><label>URL Slug<input id="slug"></label><label>产品分类<select id="category_id"><option value="">请选择分类</option></select></label><label>状态<select id="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label><label class="wide">简介<textarea id="summary"></textarea></label><label class="wide">详情<textarea id="description"></textarea></label><label>SEO Title<input id="seo_title"></label><label>SEO Description<textarea id="seo_description"></textarea></label></div><button id="save">保存产品</button><p class="hint">首次新增产品请先保存，然后才能上传图片和添加规格。</p></section><section class="panel"><h2>产品图片</h2><div id="gallery" class="gallery"><p>请先选择或保存产品。</p></div><div class="inline"><input id="productImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button id="uploadProductImage">上传产品图片</button></div></section><section class="panel"><h2>产品规格</h2><div id="specList"></div><div class="inline specs"><input id="specName" placeholder="例如 Diameter"><input id="specValue" placeholder="例如 105-350mm"><button id="addSpec">添加规格</button></div></section></main><script src="/admin.js"></script></body></html>
