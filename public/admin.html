<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMUSU CMS V3.0</title><link rel="stylesheet" href="/admin.css"></head><body><aside><b class="adminBrand">SMUSU CMS</b><button data-tab="products">产品管理</button><button data-tab="categories">分类管理</button><button data-tab="posts">新闻 / 案例</button><button data-tab="videos">视频</button><button data-tab="media">媒体库</button><button data-tab="inquiries">留言 / 询盘</button><button data-tab="settings">网站设置</button><a href="https://staging.ufya.tech" target="_blank">查看网站</a></aside><main>
<section id="products" class="tab"><h1>产品管理</h1><div id="productList"></div><hr><input id="pid" type="hidden"><div class="form"><input id="pname" placeholder="产品名称"><input id="pslug" placeholder="URL Slug"><select id="pcategory"></select><select id="pstatus"><option value="draft">草稿</option><option value="published">发布</option></select><textarea id="psummary" placeholder="简介"></textarea><textarea id="pdescription" placeholder="详情"></textarea><input id="pseo" placeholder="SEO Title"><textarea id="pseodesc" placeholder="SEO Description"></textarea></div><button id="saveProduct">保存产品</button><h2>产品图片</h2><div id="gallery" class="galleryAdmin"></div><input id="imageFile" type="file" accept="image/*"><button id="uploadImage">上传图片</button><h2>规格</h2><div id="specList"></div><div class="inline"><input id="specName" placeholder="Diameter"><input id="specValue" placeholder="105-350mm"><button id="addSpec">添加</button></div></section>
<section id="categories" class="tab hide"><h1>分类管理</h1><div id="categoryList"></div><input id="catId" type="hidden"><div class="form"><input id="catName" placeholder="分类名称"><input id="catSlug" placeholder="Slug"><input id="catSort" type="number" placeholder="排序"><select id="catStatus"><option value="published">发布</option><option value="draft">隐藏</option></select><textarea id="catDesc" placeholder="分类介绍"></textarea><input id="catImageKey" placeholder="分类图片 object_key，可从媒体库复制"></div><button id="saveCategory">保存分类</button></section>
<section id="posts" class="tab hide"><h1>新闻 / 案例</h1><div id="postList"></div><form id="postForm"><div class="form"><select name="type"><option value="company_news">Company News</option><option value="industry_news">Industry News</option><option value="case">Case</option></select><input name="title" placeholder="标题" required><input name="slug" placeholder="Slug"><select name="status"><option value="draft">草稿</option><option value="published">发布</option></select><textarea name="summary" placeholder="摘要"></textarea><textarea name="content" placeholder="正文"></textarea><input name="seo_title" placeholder="SEO Title"><textarea name="seo_description" placeholder="SEO Description"></textarea><label>封面图片<input name="cover" type="file" accept="image/*"></label></div><button>新增内容</button></form></section>
<section id="videos" class="tab hide"><h1>视频</h1><div id="videoList"></div><input id="videoTitle" placeholder="标题"><textarea id="videoDesc" placeholder="描述"></textarea><select id="videoStatus"><option value="draft">草稿</option><option value="published">发布</option></select><input id="videoFile" type="file" accept="video/mp4"><button id="uploadVideo">上传视频</button></section>
<section id="media" class="tab hide"><h1>媒体库</h1><p>同一文件按 SHA-256 去重，重复上传会复用现有 R2 对象。</p><input id="mediaFile" type="file"><button id="uploadMedia">上传媒体</button><div id="mediaGrid" class="mediaGrid"></div></section>
<section id="inquiries" class="tab hide"><h1>留言 / 询盘</h1><div class="statusBar"><button onclick="setInquiryFilter('')">全部</button><button onclick="setInquiryFilter('new')">新询盘</button><button onclick="setInquiryFilter('contacted')">已联系</button><button onclick="setInquiryFilter('quoted')">已报价</button><button onclick="setInquiryFilter('closed')">已关闭</button></div><div id="inquiryList"></div><div id="pager"></div></section>
<section id="settings" class="tab hide"><h1>网站设置</h1><div class="form"><input id="siteName" placeholder="网站/品牌名称"><input id="companyName" placeholder="公司名称"><input id="phone" placeholder="Phone"><input id="whatsapp" placeholder="WhatsApp"><input id="email" placeholder="Email"><textarea id="address" placeholder="Address"></textarea><input id="logoKey" placeholder="Logo object_key"><input id="faviconKey" placeholder="Favicon object_key"></div><p>先在媒体库上传 Logo / Favicon，然后点击“使用为 Logo/Favicon”，也可以自动填入。</p><button id="saveSettings">保存设置</button></section>
</main><dialog id="inquiryDialog"><button class="close" onclick="inquiryDialog.close()">×</button><div id="inquiryDetail"></div></dialog><script src="/admin.js"></script></body></html>
