<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMUSU CMS V2.3</title><link rel="stylesheet" href="/admin.css"></head><body><aside><b>SMUSU CMS</b><button data-tab="products">产品</button><button data-tab="posts">新闻 / 案例</button><button data-tab="videos">视频</button><button data-tab="inquiries">留言 / 询盘</button><a href="https://staging.ufya.tech" target="_blank">查看网站</a></aside><main><section id="products" class="tab"><h1>产品管理</h1><div id="productList"></div><hr><input id="pid" type="hidden"><div class="form"><input id="pname" placeholder="产品名称"><input id="pslug" placeholder="URL Slug"><select id="pcategory"></select><select id="pstatus"><option value="draft">草稿</option><option value="published">发布</option></select><textarea id="psummary" placeholder="简介"></textarea><textarea id="pdescription" placeholder="详情"></textarea><input id="pseo" placeholder="SEO Title"><textarea id="pseodesc" placeholder="SEO Description"></textarea></div><button id="saveProduct">保存产品</button><h2>图片</h2><div id="gallery" class="galleryAdmin"></div><input id="imageFile" type="file" accept="image/*"><button id="uploadImage">上传产品图片</button><h2>规格</h2><div id="specList"></div><div class="inline"><input id="specName" placeholder="Diameter"><input id="specValue" placeholder="105-350mm"><button id="addSpec">添加</button></div></section><section id="posts" class="tab hide"><h1>新闻 / 案例</h1><div id="postList"></div><div class="form"><select id="postType"><option value="company_news">Company News</option><option value="industry_news">Industry News</option><option value="case">Case</option></select><input id="postTitle" placeholder="标题"><input id="postSlug" placeholder="Slug"><textarea id="postSummary" placeholder="摘要"></textarea><textarea id="postContent" placeholder="正文"></textarea><select id="postStatus"><option value="draft">草稿</option><option value="published">发布</option></select></div><button id="savePost">新增内容</button></section><section id="videos" class="tab hide"><h1>视频</h1><div id="videoList"></div><input id="videoTitle" placeholder="视频标题"><textarea id="videoDesc" placeholder="描述"></textarea><select id="videoStatus"><option value="draft">草稿</option><option value="published">发布</option></select><input id="videoFile" type="file" accept="video/mp4"><button id="uploadVideo">上传视频</button></section><section id="inquiries" class="tab hide"><h1>留言 / 询盘</h1><div id="inquiryList"></div></section></main><script src="/admin.js"></script></body></html>
