<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMUSU CMS V2</title><link rel="stylesheet" href="/admin.css"></head><body><aside><div class="brand">SMUSU CMS</div><a href="#products">产品管理</a><a href="#media">媒体上传</a><a href="https://staging.ufya.tech" target="_blank">查看网站</a></aside><main><section class="panel" id="products"><h1>产品管理</h1><p>新增、修改产品与 SEO 信息。</p><div id="list"></div></section><section class="panel"><h2>新增 / 修改产品</h2><input id="id" type="hidden"><div class="form"><label>产品名称<input id="name"></label><label>URL Slug<input id="slug"></label><label>简介<textarea id="summary"></textarea></label><label>详情<textarea id="description"></textarea></label><label>SEO Title<input id="seo_title"></label><label>SEO Description<textarea id="seo_description"></textarea></label><label>状态<select id="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label><button id="save">保存产品</button></div></section><section class="panel" id="media"><h2>媒体上传</h2><p>支持 JPG / PNG / WebP / GIF / MP4 / PDF。</p><input id="file" type="file"><button id="upload">上传到 R2</button><pre id="result"></pre></section></main><script src="/admin.js"></script></body></html>
